[project]
name = "ppe-monitor"
version = "0.0.1"
description = "Multi-camera helmet/PPE monitoring with cross-camera incident dedup"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["eval"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "eval"]
